[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-fit-coach"
version = "0.1.0"
description = "McFit Coach (麦麦轻食官) — 基于麦当劳中国 MCP 的健身智能点餐助手"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dickeryang" }]
keywords = ["mcp", "mcdonalds", "nutrition", "meal-planner", "agent", "workbuddy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dickeryang/mcd-fit-coach"
Issues = "https://github.com/dickeryang/mcd-fit-coach/issues"

[project.scripts]
mcfc = "main:cli"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["mcd_client", "nutrition", "meal_planner", "coupon", "main", "report"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W6"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["E402"]
"tests/*" = ["E402"]
